<!DOCTYPE html>
<html>
<head>
  <title>My Pro Store</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">🟠 ProStore</div>

  <input type="text" id="search" placeholder="Search products..." onkeyup="searchProducts()">

  <div class="cart-box">
    🛒 <span id="total">0</span> MAD
  </div>
</header>

<div class="container">

  <aside>
    <h3>Categories</h3>
    <button onclick="filterCategory('all')">All</button>
    <button onclick="filterCategory('clothes')">Clothes</button>
    <button onclick="filterCategory('shoes')">Shoes</button>
    <button onclick="filterCategory('tech')">Tech</button>
  </aside>

  <main id="products"></main>

</div>

<section class="cart">
  <h2>🛒 Cart</h2>
  <ul id="cart"></ul>
</section>

<div id="toast">Added to cart ✅</div>

<script src="script.js"></script>
</body>
</html>
