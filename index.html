<!DOCTYPE html>
<html>
<head>
  <title>My Pro Shop</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🛍️ My Pro Shop</h1>
</header>

<section class="products">

  <div class="card">
    <h3>T-shirt</h3>
    <p>100 MAD</p>
    <button onclick="addToCart('T-shirt', 100)">Add</button>
  </div>

  <div class="card">
    <h3>Shoes</h3>
    <p>300 MAD</p>
    <button onclick="addToCart('Shoes', 300)">Add</button>
  </div>

  <div class="card">
    <h3>Cap</h3>
    <p>80 MAD</p>
    <button onclick="addToCart('Cap', 80)">Add</button>
  </div>

</section>

<hr>

<h2>🛒 Cart</h2>
<ul id="cart"></ul>

<h3>Total: <span id="total">0</span> MAD</h3>

<script src="script.js"></script>
</body>
</html>
