<!DOCTYPE html>
<html>
<head>
  <title>Pro Market</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">🟠 ProMarket</div>

  <input type="text" id="search" placeholder="Search products..." onkeyup="searchProducts()">

  <div class="cart-box">
    🛒 Cart: <span id="total">0</span> MAD
  </div>
</header>

<div class="container">

  <aside>
    <h3>Categories</h3>
    <button onclick="filterCategory('all')">All</button>
    <button onclick="filterCategory('clothes')">Clothes</button>
    <button onclick="filterCategory('shoes')">Shoes</button>
    <button onclick="filterCategory('tech')">Tech</button>
  </aside>

  <main>

    <div class="card clothes">
      <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">
      <h3>T-shirt</h3>
      <div class="stars">⭐⭐⭐⭐☆</div>
      <p>100 MAD</p>
      <button onclick="addToCart('T-shirt',100)">Add to cart</button>
    </div>

    <div class="card shoes">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
      <h3>Shoes</h3>
      <div class="stars">⭐⭐⭐⭐⭐</div>
      <p>350 MAD</p>
      <button onclick="addToCart('Shoes',350)">Add to cart</button>
    </div>

    <div class="card tech">
      <img src="https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5">
      <h3>Headphones</h3>
      <div class="stars">⭐⭐⭐⭐☆</div>
      <p>200 MAD</p>
      <button onclick="addToCart('Headphones',200)">Add to cart</button>
    </div>

  </main>

</div>

<section class="cart">
  <h2>🛒 Cart</h2>
  <ul id="cart"></ul>
</section>

<div id="toast">Added to cart ✅</div>

<script src="script.js"></script>
</body>
</html>
